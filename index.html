<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZEOSK | Rəqəmsal Vizitkart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===================== EASY EDIT ZONE =====================
     Bütün linkləri və mətnləri aşağıdakı CONFIG obyektindən
     dəyişə bilərsiniz (səhifənin sonunda, <script> içində).
     ============================================================ */

  :root{
    --bg-0:#05070d;
    --bg-1:#0a0f1c;
    --panel:#0e1524;
    --panel-border:rgba(255,255,255,0.08);
    --blue:#3aa0ff;
    --blue-2:#7c6bff;
    --violet:#a855f7;
    --text-0:#f2f4f8;
    --text-1:#9aa3b5;
    --text-2:#5b6478;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    min-height:100%;
    background:var(--bg-0);
    font-family:'Inter', -apple-system, sans-serif;
    color:var(--text-0);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    min-height:100svh;
    height:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom)) 20px;
    position:relative;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(600px 400px at 50% -10%, rgba(58,160,255,0.16), transparent 60%),
      radial-gradient(500px 380px at 85% 100%, rgba(168,85,247,0.14), transparent 60%),
      var(--bg-0);
  }

  /* faint circuit-grid backdrop — nods to ZEOSK's tech identity */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(122,150,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122,150,255,0.05) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(600px 500px at 50% 20%, black, transparent 75%);
    pointer-events:none;
  }

  .card{
    width:100%;
    max-width:380px;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:rise 0.7s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Logo mark ---------- */
  .mark-wrap{
    position:relative;
    width:330px;
    max-width:88vw;
    margin-bottom:26px;
  }
  .mark-glow{
    position:absolute; inset:10% -10% -6% -10%;
    background:radial-gradient(circle, rgba(58,160,255,0.4), rgba(168,85,247,0.18) 55%, transparent 72%);
    filter:blur(18px);
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.7; transform:scale(1);}
    50%{opacity:1; transform:scale(1.05);}
  }
  .mark-img{
    position:relative;
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 10px 30px rgba(58,160,255,0.25));
  }

  .tagline{
    font-size:11px;
    letter-spacing:4px;
    color:var(--text-1);
    text-transform:uppercase;
    margin-bottom:34px;
  }

  /* ---------- Link buttons ---------- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    --accent:var(--blue);
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    text-decoration:none;
    color:var(--text-0);
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    overflow:hidden;
  }
  .link-btn::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent, color-mix(in srgb, var(--accent) 18%, transparent), transparent);
    transform:translateX(-120%);
    transition:transform .5s ease;
  }
  .link-btn:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb, var(--accent) 55%, var(--panel-border));
    background:#111a2d;
  }
  .link-btn:hover::before{ transform:translateX(120%); }
  .link-btn:active{ transform:translateY(0) scale(.99); }

  .icon{
    width:22px; height:22px;
    flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .icon svg{ width:100%; height:100%; }
  .icon img{ width:100%; height:100%; object-fit:contain; }

  .footer-note{
    margin-top:30px;
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-2);
    text-align:center;
  }

  /* ---------- Splash screen ---------- */
  #splash{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-0);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .splash-logo-wrap{
    position:relative;
    width:180px;
    animation:splash-in .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes splash-in{
    from{opacity:0; transform:scale(.85);}
    to{opacity:1; transform:scale(1);}
  }
  .splash-glow{
    position:absolute; inset:6% -14% -6% -14%;
    background:radial-gradient(circle, rgba(58,160,255,0.45), rgba(168,85,247,0.2) 55%, transparent 72%);
    filter:blur(20px);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .splash-logo-wrap img{
    position:relative;
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 10px 30px rgba(58,160,255,0.3));
  }

  body.loading{ overflow:hidden; }
  .card{ animation:none; opacity:0; }
  .card.ready{ animation:rise 0.7s cubic-bezier(.2,.8,.2,1) both; }
</style>
</head>
<body class="loading">

  <div id="splash">
    <div class="splash-logo-wrap">
      <div class="splash-glow"></div>
      <img src="assets/zeosk-logo.png" alt="ZEOSK">
    </div>
  </div>

  <div class="card">

    <div class="mark-wrap">
      <div class="mark-glow"></div>
      <img class="mark-img" src="assets/zeosk-logo.png" alt="ZEOSK">
    </div>

    <div class="links" id="links"></div>

    <div class="footer-note">Powered by ZEOSK Software Ecosystem</div>

  </div>

<script>
  // ===================== CONFIG — buradan redaktə edin =====================
  const CONFIG = [
    {
      label: "WhatsApp",
      accent: "#25D366",
      href: "https://wa.me/994709060986",
      icon: `<path fill="currentColor" d="M17.6 6.32A7.85 7.85 0 0 0 12.02 4C7.66 4 4.13 7.52 4.13 11.88c0 1.4.37 2.76 1.07 3.96L4 20l4.28-1.12a7.86 7.86 0 0 0 3.74.95h0c4.36 0 7.9-3.52 7.9-7.88a7.83 7.83 0 0 0-2.32-5.63zm-5.58 12.13h0a6.55 6.55 0 0 1-3.34-.92l-.24-.14-2.48.65.66-2.42-.16-.25a6.53 6.53 0 0 1-1-3.49c0-3.62 2.95-6.57 6.58-6.57 1.76 0 3.41.68 4.65 1.93a6.53 6.53 0 0 1 1.93 4.65c0 3.62-2.96 6.56-6.6 6.56zm3.6-4.92c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.44.1-.13.19-.5.64-.62.78-.11.13-.23.15-.42.05-.2-.1-.82-.3-1.56-.96-.58-.51-.96-1.15-1.08-1.34-.11-.2-.01-.3.09-.4.09-.09.2-.23.3-.35.1-.11.13-.19.2-.32.07-.13.03-.25-.02-.35-.05-.1-.44-1.06-.6-1.45-.16-.38-.32-.33-.44-.34h-.38c-.13 0-.34.05-.52.24-.18.19-.68.66-.68 1.62s.7 1.88.79 2.01c.1.13 1.37 2.1 3.33 2.94.46.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94.17-.46.17-.85.12-.94-.05-.08-.18-.13-.38-.23z"/>`
    },
    {
      label: "Instagram",
      accent: "#e1306c",
      href: "https://www.instagram.com/_zeosk_",
      icon: `<rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>`
    },
    {
      label: "ZEOSK Web",
      accent: "#3aa0ff",
      href: "https://zeoskse.com",
      img: "assets/zeosk-web-icon.png"
    },
    {
      label: "Zeosk Guest",
      accent: "#f5a623",
      href: "https://zeoskguest.com",                // <-- öz demo/sayt linkinizi yazın
      img: "assets/guest-logo.png"
    },
    {
      label: "Email",
      accent: "#4fc3f7",
      href: "mailto:info@zeoskse.com",
      icon: `<rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`
    }
  ];
  // ============================================================================

  const wrap = document.getElementById('links');
  CONFIG.forEach(item => {
    const a = document.createElement('a');
    a.href = item.href;
    a.className = 'link-btn';
    a.style.setProperty('--accent', item.accent);
    if (item.href.startsWith('http')) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
    const iconHtml = item.img
      ? `<img src="${item.img}" alt="">`
      : `<svg viewBox="0 0 24 24" fill="none">${item.icon}</svg>`;
    a.innerHTML = `<span class="icon">${iconHtml}</span><span>${item.label}</span>`;
    wrap.appendChild(a);
  });

  // ---------- Splash screen ----------
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      document.body.classList.remove('loading');
      document.querySelector('.card').classList.add('ready');
    }, 1400);
  });
</script>

</body>
</html>
